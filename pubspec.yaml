name: score_poker
description: "포커 스타일 점수 배틀 카드 게임 (Android & iOS). 베팅 없음."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_svg: ^2.0.10
  shared_preferences: ^2.5.5
  lottie: ^3.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  # gen-l10n: lib/l10n/*.arb -> AppLocalizations 생성
  generate: true
  uses-material-design: true
  assets:
    - assets/lottie/
  fonts:
    - family: AlfaSlabOne
      fonts:
        - asset: assets/fonts/AlfaSlabOne-Regular.ttf

name: score_poker
description: "포커 스타일 점수 배틀 카드 게임 (Android & iOS). 베팅 없음."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_svg: ^2.0.10
  shared_preferences: ^2.5.5
  lottie: ^3.5.1
  # 인앱 결제(소비성 토큰). 안드로이드/iOS에서만 동작 — 웹·데스크톱은 StubPurchaseService.
  in_app_purchase: ^3.2.0
  # 효과음(assets/sfx — 실사는 tool/import_sfx.py, 합성은 tool/gen_sfx.py). 실패해도 게임엔 영향 없음.
  audioplayers: ^6.1.0
  # 햅틱 — Android 진폭 제어 진동(VibrationEffect). iOS는 표준 HapticFeedback(Taptic)을 쓴다.
  vibration: ^3.1.3
  in_app_purchase_android: ^0.4.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
flutter:
  # gen-l10n: lib/l10n/*.arb -> AppLocalizations 생성
  generate: true
  uses-material-design: true
  assets:
    - assets/lottie/
    - assets/sfx/
    - assets/elements/
    - shorebird.yaml
  fonts:
    - family: AlfaSlabOne
      fonts:
        - asset: assets/fonts/AlfaSlabOne-Regular.ttf
